<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الترويج والذكاء الاصطناعي - وجه لوجه</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Plus Jakarta Sans Font -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }

        // --- المتغيرات العامة وقواعد البيانات المحلية ---
        window.currentThemeKey = 'emerald';
        window.usersDB = JSON.parse(localStorage.getItem('f2f_users_db')) || [];
        window.currentUser = JSON.parse(localStorage.getItem('f2f_user')) || null;
        window.currentCategory = 'all';
        window.aiSessionActive = false;

        const themes = {
            emerald: { name: 'زمرد كريستالي', p500: '#10b981', p600: '#059669' },
            sapphire: { name: 'ياقوت أزرق', p500: '#3b82f6', p600: '#2563eb' },
            gold: { name: 'ذهبي شمسي', p500: '#f59e0b', p600: '#d97706' },
            neon: { name: 'ماجنتا سيبراني', p500: '#ec4899', p600: '#db2777' },
            obsidian: { name: 'أوبسيديان مخملي', p500: '#8b5cf6', p600: '#7c3aed' },
            ruby: { name: 'ياقوت أحمر', p500: '#ef4444', p600: '#dc2626' },
            cyan: { name: 'سيريان نيون', p500: '#06b6d4', p600: '#0891b2' }
        };

        window.applyTheme = function(key) {
            window.currentThemeKey = key;
            const t = themes[key];
            const root = document.documentElement;
            root.style.setProperty('--theme-500', t.p500);
            root.style.setProperty('--theme-600', t.p600);
            
            const badge = document.getElementById('theme-name-display');
            if (badge) badge.innerText = t.name;

            document.querySelectorAll('.theme-dot').forEach(dot => {
                if (dot.getAttribute('data-theme') === key) {
                    dot.classList.add('ring-2', 'ring-white', 'scale-110');
                } else {
                    dot.classList.remove('ring-2', 'ring-white', 'scale-110');
                }
            });
        };

        // دالة توليد الشارات (Badges) بناءً على الرتبة
        window.getUserBadgeHTML = function(role) {
            if (role === 'admin') {
                return `<span class="inline-flex items-center gap-1 bg-amber-500/20 text-amber-400 border border-amber-500/40 px-1.5 py-0.5 rounded text-[9px] font-extrabold mr-2 shadow-[0_0_8px_rgba(245,158,11,0.4)]"><i class="fa-solid fa-crown text-amber-400"></i> النسر الذهبي (المدير)</span>`;
            } else if (role === 'trusted') {
                return `<span class="inline-flex items-center gap-1 bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 px-1.5 py-0.5 rounded text-[9px] font-bold mr-2"><i class="fa-solid fa-certificate text-emerald-400"></i> بائع موثوق</span>`;
            } else {
                return `<span class="inline-flex items-center gap-1 bg-blue-500/20 text-blue-400 border border-blue-500/40 px-1.5 py-0.5 rounded text-[9px] font-bold mr-2"><i class="fa-solid fa-user-check text-blue-400"></i> عضو متفاعل</span>`;
            }
        };

        window.listingsData = JSON.parse(localStorage.getItem('f2f_listings')) || [
            { id: 1, title: "iPhone 15 Pro Max 256GB - بحالة ممتازة", category: "phones", price: 68500, location: "إسطنبول، كاديكوي", image: "https://placehold.co/400x300/0f172a/10b981?text=iPhone+15", views: 1240 },
            { id: 2, title: "سيارة فورد فوكس 2022 اتوماتيك", category: "cars", price: 940000, location: "أنقرة، جانكايا", image: "https://placehold.co/400x300/0f172a/059669?text=Ford+Focus", views: 3120 }
        ];

        window.chatMessages = [
            { sender: 'التاجر أحمد', role: 'trusted', text: 'مرحباً، هل يمكنني الحصول على معلومات حول المنتج؟', translated: 'مرحباً بالجميع', time: '10:30' },
            { sender: 'العميل محمد', role: 'active', text: 'بالطبع، في أي شيء يمكنني مساعدتك؟', translated: 'أهلاً بك', time: '10:31' }
        ];

        function formatCategoryName(cat) {
            switch(cat) {
                case 'phones': return 'هواتف';
                case 'cars': return 'سيارات';
                case 'construction': return 'مقاولات';
                case 'computers': return 'كمبيوتر';
                case 'aiChat': return 'ذكاء اصطناعي';
                case 'misc': return 'متفرقات';
                default: return 'عام';
            }
        }

        window.renderCategories = function() {
            const container = document.getElementById('categories-container');
            if(!container) return;
            const cats = [
                { id: 'all', name: 'الكل', icon: 'fa-border-all' },
                { id: 'phones', name: 'هواتف', icon: 'fa-mobile-screen' },
                { id: 'cars', name: 'سيارات', icon: 'fa-car' },
                { id: 'construction', name: 'مقاولات', icon: 'fa-building' },
                { id: 'computers', name: 'كمبيوتر', icon: 'fa-laptop' },
                { id: 'aiChat', name: 'ذكاء اصطناعي', icon: 'fa-brain' },
                { id: 'misc', name: 'متفرقات', icon: 'fa-box-archive' }
            ];

            container.innerHTML = '';
            cats.forEach(c => {
                const isActive = window.currentCategory === c.id;
                const btn = document.createElement('button');
                btn.onclick = () => window.filterCategory(c.id);
                btn.className = `category-btn flex flex-col items-center justify-center min-w-[76px] h-20 rounded-2xl shadow-md transition-all flex-shrink-0 active:scale-95 font-bold ${
                    isActive ? 'bg-[var(--theme-500)] text-slate-950 shadow-[var(--theme-500)]/30' : 'bg-slate-900 hover:bg-slate-800 text-slate-300 border border-slate-800'
                }`;
                btn.innerHTML = `
                    <i class="fa-solid ${c.icon} text-base mb-1.5 ${isActive ? 'text-slate-950' : 'text-[var(--theme-500)]'}"></i>
                    <span class="text-[11px]">${c.name}</span>
                `;
                container.appendChild(btn);
            });
        };

        window.renderListings = function(items) {
            const grid = document.getElementById('listings-grid');
            const countEl = document.getElementById('listing-count');
            if (!grid || !countEl) return;
            grid.innerHTML = '';
            countEl.innerText = `${items.length} إعلان`;

            if (items.length === 0) {
                grid.innerHTML = `<div class="col-span-2 text-center py-10 text-slate-400 text-xs">لا توجد إعلانات مطابقة لبحثك.</div>`;
                return;
            }

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-slate-900 border border-slate-800 hover:border-[var(--theme-500)] rounded-2xl overflow-hidden transition-all flex flex-col justify-between shadow-lg";
                card.innerHTML = `
                    <div>
                        <div class="relative h-36 bg-slate-950 overflow-hidden">
                            <img src="${item.image}" alt="${item.title}" class="w-full h-full object-cover opacity-90 hover:opacity-100 transition-opacity" onerror="this.src='https://placehold.co/400x300/0f172a/10b981?text=صورة+المنتج'">
                            <span class="absolute top-2 left-2 bg-slate-900/95 backdrop-blur-md text-[var(--theme-500)] border border-slate-700 text-[10px] px-2.5 py-0.5 rounded-full font-bold">
                                ${formatCategoryName(item.category)}
                            </span>
                        </div>
                        <div class="p-3">
                            <h4 class="font-semibold text-xs text-white line-clamp-2 mb-1">${item.title}</h4>
                            <p class="text-[10px] text-slate-400"><i class="fa-solid fa-location-dot ml-1 text-[var(--theme-500)]"></i>${item.location}</p>
                        </div>
                    </div>
                    <div class="p-3 pt-0 flex items-center justify-between mt-2">
                        <span class="font-extrabold text-sm text-[var(--theme-500)]">${item.price.toLocaleString()} ₺</span>
                        <div class="flex space-x-1.5 space-x-reverse">
                            <button onclick="window.openChatModal()" class="w-7 h-7 rounded-xl bg-slate-800 hover:bg-[var(--theme-500)] hover:text-slate-950 text-slate-300 flex items-center justify-center transition-colors" title="محادثة">
                                <i class="fa-solid fa-comments text-xs"></i>
                            </button>
                            <button onclick="window.showDetails(${item.id})" class="w-7 h-7 rounded-xl bg-slate-800 hover:bg-[var(--theme-500)] hover:text-slate-950 text-slate-300 flex items-center justify-center transition-colors" title="التفاصيل">
                                <i class="fa-solid fa-arrow-left text-xs"></i>
                            </button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        };

        window.renderChatMessages = function() {
            const container = document.getElementById('chat-messages-container');
            if (!container) return;
            container.innerHTML = '';
            window.chatMessages.forEach(m => {
                const badge = window.getUserBadgeHTML(m.role);
                const div = document.createElement('div');
                div.className = "bg-slate-950 border border-slate-800 p-3 rounded-2xl";
                div.innerHTML = `
                    <div class="flex justify-between items-center mb-1">
                        <div class="flex items-center">
                            <span class="text-[11px] font-bold text-[var(--theme-500)]">${m.sender}</span>
                            ${badge}
                        </div>
                        <span class="text-[9px] text-slate-500">${m.time}</span>
                    </div>
                    <p class="text-xs text-white">${m.text}</p>
                    <div class="mt-1 pt-1 border-t border-slate-900 text-[11px] text-teal-400 italic">
                        <i class="fa-solid fa-language text-[10px] ml-1"></i> ${m.translated}
                    </div>
                `;
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
        };

        window.sendChatMessage = function(e) {
            e.preventDefault();
            const input = document.getElementById('chat-input');
            if (!input || !input.value.trim()) return;
            const text = input.value.trim();
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            const senderName = window.currentUser ? window.currentUser.username : 'مستخدم ضيف';
            const senderRole = window.currentUser ? window.currentUser.role : 'active';

            window.chatMessages.push({
                sender: senderName,
                role: senderRole,
                text,
                translated: `[مترجم]: ${text}`,
                time
            });
            input.value = '';
            window.renderChatMessages();
        };

        // النوافذ المنبثقة
        window.showLocationModal = () => document.getElementById('city-modal').classList.remove('hidden');
        window.closeCityModal = () => document.getElementById('city-modal').classList.add('hidden');
        window.selectCity = (city) => { document.getElementById('selected-city').innerText = city; window.closeCityModal(); };

        window.openPostModal = () => {
            if (!window.currentUser) {
                window.showAlertMessage("مطلوب تسجيل الدخول", "يرجى تسجيل الدخول أو إنشاء حساب لتتمكن من إضافة إعلان.");
                window.showAuthModal();
                return;
            }
            document.getElementById('post-modal').classList.remove('hidden');
        };
        window.closePostModal = () => document.getElementById('post-modal').classList.add('hidden');

        window.openChatModal = () => {
            document.getElementById('chat-modal').classList.remove('hidden');
            window.renderChatMessages();
        };
        window.closeChatModal = () => document.getElementById('chat-modal').classList.add('hidden');

        window.showFavoritesModal = () => window.showAlertMessage('المفضلة', 'لا توجد إعلانات مفضلة لديك حالياً.');

        // نظام البروفايل وعرض الشارات
        window.showProfileModal = function() {
            if (!window.currentUser) {
                window.showAuthModal();
            } else {
                document.getElementById('profile-view-name').innerText = window.currentUser.username;
                document.getElementById('profile-view-email').innerText = window.currentUser.email;
                document.getElementById('profile-view-phone').innerText = window.currentUser.phone || 'غير متوفر';
                document.getElementById('profile-view-bio').innerText = window.currentUser.bio || 'تاجر معتمد في منصة الذكاء الاصطناعي وجه لوجه.';
                
                // عرض الشارة في البروفايل
                document.getElementById('profile-view-badge').innerHTML = window.getUserBadgeHTML(window.currentUser.role);
                
                if (window.currentUser.avatar) {
                    document.getElementById('profile-view-avatar').src = window.currentUser.avatar;
                }

                document.getElementById('edit-username').value = window.currentUser.username;
                document.getElementById('edit-phone').value = window.currentUser.phone || '';
                document.getElementById('edit-bio').value = window.currentUser.bio || '';

                document.getElementById('profile-modal').classList.remove('hidden');
            }
        };

        window.closeProfileModal = () => document.getElementById('profile-modal').classList.add('hidden');

        window.logoutUser = function() {
            localStorage.removeItem('f2f_user');
            window.currentUser = null;
            window.closeProfileModal();
            window.showAlertMessage('تم تسجيل الخروج', 'لقد قمت بتسجيل الخروج بنجاح.');
        };

        window.saveProfileChanges = function(e) {
            e.preventDefault();
            window.currentUser.username = document.getElementById('edit-username').value;
            window.currentUser.phone = document.getElementById('edit-phone').value;
            window.currentUser.bio = document.getElementById('edit-bio').value;
            
            const avatarFile = document.getElementById('edit-avatar-file');
            if (avatarFile.files && avatarFile.files[0]) {
                const reader = new FileReader();
                reader.onload = function(uploadEvent) {
                    window.currentUser.avatar = uploadEvent.target.result;
                    finalizeProfileUpdate();
                };
                reader.readAsDataURL(avatarFile.files[0]);
            } else {
                finalizeProfileUpdate();
            }
        };

        function finalizeProfileUpdate() {
            localStorage.setItem('f2f_user', JSON.stringify(window.currentUser));
            const userIndex = window.usersDB.findIndex(u => u.email === window.currentUser.email);
            if (userIndex !== -1) {
                window.usersDB[userIndex] = window.currentUser;
                localStorage.setItem('f2f_users_db', JSON.stringify(window.usersDB));
            }
            window.closeProfileModal();
            window.showAlertMessage('تم التحديث بنجاح', 'تم حفظ التعديلات بنجاح.');
        }

        // نظام المصادقة (التسجيل والدخول)
        window.showAuthModal = function() {
            const authModal = document.getElementById('auth-modal');
            if (authModal) {
                authModal.classList.remove('hidden');
                window.switchAuthTab('login');
            }
        };

        window.closeAuthModal = () => document.getElementById('auth-modal').classList.add('hidden');

        window.switchAuthTab = function(tab) {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                tabLogin.classList.add('border-[var(--theme-500)]', 'text-[var(--theme-500)]');
                tabLogin.classList.remove('border-transparent', 'text-slate-400');
                tabRegister.classList.add('border-transparent', 'text-slate-400');
                tabRegister.classList.remove('border-[var(--theme-500)]', 'text-[var(--theme-500)]');
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                tabRegister.classList.add('border-[var(--theme-500)]', 'text-[var(--theme-500)]');
                tabRegister.classList.remove('border-transparent', 'text-slate-400');
                tabLogin.classList.add('border-transparent', 'text-slate-400');
                tabLogin.classList.remove('border-[var(--theme-500)]', 'text-[var(--theme-500)]');
            }
        };

        window.handleLogin = function(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim().toLowerCase();
            const password = document.getElementById('login-password').value;

            const existingUser = window.usersDB.find(u => u.email === email && u.password === password);

            if (existingUser) {
                window.currentUser = existingUser;
                localStorage.setItem('f2f_user', JSON.stringify(window.currentUser));
                window.closeAuthModal();
                window.showAlertMessage('مرحباً بعودتك', `تم تسجيل الدخول بنجاح يا ${existingUser.username}.`);
            } else {
                window.showAlertMessage('بيانات غير صحيحة', 'البريد الإلكتروني أو كلمة المرور غير صحيحة.');
            }
        };

        window.handleRegister = function(e) {
            e.preventDefault();
            const username = document.getElementById('reg-username').value.trim();
            const email = document.getElementById('reg-email').value.trim().toLowerCase();
            const phone = document.getElementById('reg-phone').value.trim();
            const password = document.getElementById('reg-password').value;

            if (!email.endsWith('@gmail.com')) {
                window.showAlertMessage('خطأ في البريد الإلكتروني', 'عذراً، يجب أن يكون البريد الإلكتروني حصراً عبر حساب جيميل أساسي.');
                return;
            }

            const cleanPhone = phone.replace(/[^0-9]/g, '');
            if (cleanPhone.length < 10 || /^0+$/.test(cleanPhone)) {
                window.showAlertMessage('رقم هاتف غير صالح', 'يرجى إدخال رقم هاتف حقيقي صحيح.');
                return;
            }

            if (window.usersDB.some(u => u.email === email)) {
                window.showAlertMessage('الحساب موجود', 'هذا البريد مسجل مسبقاً، تفضل بتسجيل الدخول.');
                return;
            }

            // تحديد رتبة المستخدم (النسر الذهبي للإدارة)
            let userRole = 'active'; // الافتراضي
            if (email === 'admin@gmail.com' || username.includes('أدمن') || username.includes('مدير')) {
                userRole = 'admin'; // النسر الذهبي
            } else if (username.includes('تاجر')) {
                userRole = 'trusted'; // بائع موثوق
            }

            const newUser = {
                username,
                email,
                phone,
                password,
                role: userRole,
                bio: 'مستخدم معتمد في المنصة.',
                avatar: 'https://placehold.co/150x150/0f172a/10b981?text=بروفايل'
            };

            window.usersDB.push(newUser);
            localStorage.setItem('f2f_users_db', JSON.stringify(window.usersDB));

            window.currentUser = newUser;
            localStorage.setItem('f2f_user', JSON.stringify(window.currentUser));
            
            window.closeAuthModal();
            window.showAlertMessage('تم إنشاء الحساب بنجاح', `أهلاً بك يا ${username}\nتم تعيين رتبتك بنجاح.`);
        };

        window.showAlertMessage = function(title, text) {
            document.getElementById('custom-modal-title').innerText = title;
            document.getElementById('custom-modal-text').innerText = text;
            document.getElementById('custom-modal').classList.remove('hidden');
        };

        window.closeCustomModal = () => document.getElementById('custom-modal').classList.add('hidden');

        // نشر إعلان جديد
        window.submitNewAd = function(e) {
            e.preventDefault();
            const title = document.getElementById('ad-title').value;
            const category = document.getElementById('ad-category').value;
            const price = parseFloat(document.getElementById('ad-price').value) || 0;
            const location = document.getElementById('ad-location').value || 'إسطنبول';
            const fileInput = document.getElementById('ad-image-file');

            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(uploadEvent) {
                    saveAndPublishAd(title, category, price, location, uploadEvent.target.result);
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                saveAndPublishAd(title, category, price, location, 'https://placehold.co/400x300/0f172a/10b981?text=صورة+المنتج');
            }
        };

        function saveAndPublishAd(title, category, price, location, imageSrc) {
            window.listingsData.unshift({
                id: window.listingsData.length + 1,
                title, category, price, location, image: imageSrc, views: 1
            });
            localStorage.setItem('f2f_listings', JSON.stringify(window.listingsData));
            window.closePostModal();
            window.renderListings(window.listingsData);
            window.showAlertMessage("عملية ناجحة", "تم نشر إعلانك بنجاح.");
            document.getElementById('post-ad-form').reset();
        }

        window.switchTab = function(tabId) {
            document.querySelectorAll('.app-section').forEach(sec => sec.classList.add('hidden'));
            document.getElementById(tabId).classList.remove('hidden');
            document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('text-[var(--theme-500)]'));
            document.getElementById('nav-btn-' + tabId).classList.add('text-[var(--theme-500)]');
        };

        document.addEventListener('DOMContentLoaded', () => {
            window.applyTheme('emerald');
            window.renderCategories();
            window.renderListings(window.listingsData);
        });
    </script>
    <style>
        :root { --theme-500: #10b981; --theme-600: #059669; }
        body { background-color: #090d16; color: #f3f4f6; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #090d16; }
        ::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #374151; }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans select-none antialiased">

    <!-- الرأس -->
    <header class="sticky top-0 z-40 bg-slate-950/90 backdrop-blur-md border-b border-slate-800 px-4 py-3">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3 space-x-reverse cursor-pointer" onclick="window.switchTab('home-section')">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-[var(--theme-500)] to-teal-400 flex items-center justify-center text-slate-950 font-black text-lg shadow-lg">
                    <i class="fa-solid fa-brain"></i>
                </div>
                <div>
                    <h1 class="font-extrabold text-sm tracking-tight text-white flex items-center gap-1.5">الذكاء الاصطناعي وجه لوجه</h1>
                    <p class="text-[10px] text-slate-400">منصة الترويج والبيع الذكي</p>
                </div>
            </div>
            <button onclick="window.showProfileModal()" class="w-8 h-8 rounded-xl bg-slate-900 border border-slate-800 flex items-center justify-center text-slate-300 hover:text-[var(--theme-500)] transition-colors">
                <i class="fa-solid fa-user text-xs"></i>
            </button>
        </div>
    </header>

    <!-- المحتوى -->
    <main class="flex-1 max-w-md w-full mx-auto p-4 pb-24 space-y-5">
        <!-- الرئيسية -->
        <div id="home-section" class="app-section space-y-5">
            <div class="flex items-center justify-between pt-2">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">الإعلانات النشطة</h3>
                <span id="listing-count" class="text-[10px] bg-slate-900 border border-slate-800 text-[var(--theme-500)] font-bold px-2.5 py-1 rounded-xl">0 إعلان</span>
            </div>
            <div id="listings-grid" class="grid grid-cols-2 gap-3"></div>
        </div>

        <!-- المحادثة -->
        <div id="chat-section" class="app-section hidden space-y-4">
            <div class="bg-slate-900 border border-slate-800 rounded-3xl p-4 flex flex-col h-[500px]">
                <div class="border-b border-slate-800 pb-3 mb-3 flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <div class="w-8 h-8 rounded-xl bg-[var(--theme-500)]/20 text-[var(--theme-500)] flex items-center justify-center font-bold text-xs"><i class="fa-solid fa-comments"></i></div>
                        <div><h4 class="font-bold text-xs text-white">محادثة الإعلانات</h4></div>
                    </div>
                </div>
                <div id="chat-messages-container" class="flex-1 overflow-y-auto space-y-3 pl-1 text-xs"></div>
                <form onsubmit="window.sendChatMessage(event)" class="mt-3 pt-3 border-t border-slate-800 flex gap-2">
                    <input type="text" id="chat-input" placeholder="اكتب رسالتك هنا..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-[var(--theme-500)]">
                    <button type="submit" class="bg-[var(--theme-500)] hover:bg-[var(--theme-600)] text-slate-950 font-bold px-4 py-2 rounded-xl text-xs transition-colors">إرسال</button>
                </form>
            </div>
        </div>
    </main>

    <!-- شريط التنقل السفلي -->
    <nav class="fixed bottom-0 left-0 right-0 z-40 bg-slate-950/95 backdrop-blur-md border-t border-slate-800 py-2 px-4">
        <div class="max-w-md mx-auto flex items-center justify-around">
            <button onclick="window.switchTab('home-section')" id="nav-btn-home-section" class="nav-item flex flex-col items-center text-[var(--theme-500)] transition-colors">
                <i class="fa-solid fa-house text-sm mb-1"></i><span class="text-[10px] font-bold">الرئيسية</span>
            </button>
            <button onclick="window.switchTab('chat-section')" id="nav-btn-chat-section" class="nav-item flex flex-col items-center text-slate-400 hover:text-[var(--theme-500)] transition-colors">
                <i class="fa-solid fa-comments text-sm mb-1"></i><span class="text-[10px] font-bold">المحادثة</span>
            </button>
            <button onclick="window.openPostModal()" class="flex flex-col items-center -mt-5">
                <div class="w-12 h-12 rounded-2xl bg-[var(--theme-500)] text-slate-950 flex items-center justify-center shadow-lg font-bold text-lg"><i class="fa-solid fa-plus"></i></div>
                <span class="text-[10px] font-bold text-slate-400 mt-1">أضف إعلان</span>
            </button>
        </div>
    </nav>

    <!-- النوافذ المنبثقة -->

    <!-- نافذة البروفايل (تظهر الشارة) -->
    <div id="profile-modal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-sm p-5 space-y-4 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                <h3 class="font-extrabold text-sm text-white"><i class="fa-solid fa-id-badge text-[var(--theme-500)] ml-2"></i>الملف الشخصي</h3>
                <button onclick="window.closeProfileModal()" class="w-7 h-7 rounded-xl bg-slate-800 text-slate-400 flex items-center justify-center"><i class="fa-solid fa-xmark text-xs"></i></button>
            </div>
            
            <div class="flex flex-col items-center text-center space-y-2 py-3 border-b border-slate-800">
                <img id="profile-view-avatar" src="" alt="صورة البروفايل" class="w-20 h-20 rounded-full object-cover border-2 border-[var(--theme-500)] shadow-md">
                <div>
                    <h4 id="profile-view-name" class="font-extrabold text-sm text-white">اسم المستخدم</h4>
                    <div id="profile-view-badge" class="mt-1"></div> <!-- هنا يظهر النسر الذهبي -->
                    <p id="profile-view-email" class="text-[11px] text-[var(--theme-500)] mt-1">user@gmail.com</p>
                    <p id="profile-view-phone" class="text-[10px] text-slate-400">0532 000 00 00</p>
                </div>
            </div>

            <form onsubmit="window.saveProfileChanges(event)" class="space-y-3">
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 mb-1">الاسم الكامل</label>
                    <input type="text" id="edit-username" autocomplete="name" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 mb-1">رقم الهاتف</label>
                    <input type="tel" id="edit-phone" autocomplete="tel" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white">
                </div>
                <div class="flex gap-2 pt-2">
                    <button type="submit" class="flex-1 bg-[var(--theme-500)] hover:bg-[var(--theme-600)] text-slate-950 font-extrabold text-xs py-2.5 rounded-xl transition-all">حفظ التعديلات</button>
                    <button type="button" onclick="window.logoutUser()" class="bg-red-500/20 text-red-400 px-3 py-2.5 rounded-xl font-bold text-xs">خروج</button>
                </div>
            </form>
        </div>
    </div>

    <!-- نافذة تسجيل الدخول / إنشاء حساب -->
    <div id="auth-modal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-xs overflow-hidden shadow-2xl">
            <div class="flex border-b border-slate-800 bg-slate-950/50">
                <button onclick="window.switchAuthTab('login')" id="tab-login" class="flex-1 py-3 text-xs font-bold border-b-2 border-[var(--theme-500)] text-[var(--theme-500)]">دخول</button>
                <button onclick="window.switchAuthTab('register')" id="tab-register" class="flex-1 py-3 text-xs font-bold border-b-2 border-transparent text-slate-400">حساب جديد</button>
                <button onclick="window.closeAuthModal()" class="px-4 text-slate-400 border-r border-slate-800"><i class="fa-solid fa-xmark text-sm"></i></button>
            </div>

            <div class="p-5">
                <form id="login-form" onsubmit="window.handleLogin(event)" class="space-y-3">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 mb-1">البريد الإلكتروني</label>
                        <input type="email" id="login-email" name="email" autocomplete="email" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 mb-1">كلمة المرور</label>
                        <input type="password" id="login-password" name="password" autocomplete="current-password" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white">
                    </div>
                    <button type="submit" class="w-full bg-[var(--theme-500)] text-slate-950 font-extrabold text-xs py-2.5 rounded-xl mt-2">تسجيل الدخول</button>
                </form>

                <form id="register-form" onsubmit="window.handleRegister(event)" class="space-y-3 hidden">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 mb-1">الاسم (اكتب "أدمن" أو "مدير" لتجربة النسر الذهبي)</label>
                        <input type="text" id="reg-username" name="name" autocomplete="name" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 mb-1">البريد (جيميل حصراً)</label>
                        <input type="email" id="reg-email" name="email" autocomplete="email" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 mb-1">الهاتف</label>
                        <input type="tel" id="reg-phone" name="tel" autocomplete="tel" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 mb-1">كلمة المرور</label>
                        <input type="password" id="reg-password" name="new-password" autocomplete="new-password" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white">
                    </div>
                    <button type="submit" class="w-full bg-[var(--theme-500)] text-slate-950 font-extrabold text-xs py-2.5 rounded-xl mt-2">إنشاء الحساب</button>
                </form>
            </div>
        </div>
    </div>

    <!-- نافذة إضافة إعلان -->
    <div id="post-modal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-sm p-5 space-y-4 shadow-2xl">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                <h3 class="font-extrabold text-xs text-white"><i class="fa-solid fa-plus-circle text-[var(--theme-500)] ml-2"></i>إضافة إعلان</h3>
                <button onclick="window.closePostModal()" class="w-7 h-7 rounded-xl bg-slate-800 text-slate-400 flex items-center justify-center"><i class="fa-solid fa-xmark text-xs"></i></button>
            </div>
            <form id="post-ad-form" onsubmit="window.submitNewAd(event)" class="space-y-3">
                <input type="text" id="ad-title" required placeholder="عنوان الإعلان" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white">
                <select id="ad-category" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white">
                    <option value="phones">هواتف</option><option value="cars">سيارات</option>
                </select>
                <input type="number" id="ad-price" required placeholder="السعر" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white">
                <input type="text" id="ad-location" required placeholder="الموقع" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white">
                <input type="file" id="ad-image-file" accept="image/*" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white file:bg-[var(--theme-500)] file:border-0 file:rounded file:px-2">
                <button type="submit" class="w-full bg-[var(--theme-500)] text-slate-950 font-extrabold text-xs py-2.5 rounded-xl mt-2">نشر الإعلان</button>
            </form>
        </div>
    </div>

    <!-- نافذة التنبيهات -->
    <div id="custom-modal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-xs p-5 space-y-4 shadow-2xl text-center">
            <h4 id="custom-modal-title" class="font-bold text-sm text-white mb-1">تنبيه</h4>
            <p id="custom-modal-text" class="text-xs text-slate-300 whitespace-pre-line mb-4"></p>
            <button onclick="window.closeCustomModal()" class="w-full bg-[var(--theme-500)] text-slate-950 font-extrabold text-xs py-2.5 rounded-xl">حسناً</button>
        </div>
    </div>

</body>
</html>
