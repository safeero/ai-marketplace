<!DOCTYPE html>
<html lang="tr" dir="ltr" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face-to-Face AI | Türkiye Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#f0fdf4', 500: '#10b981', 600: '#059669', 700: '#047857' }
                    }
                }
            }
        }
    </script>
    <style>
        .glass-panel { background: rgba(17, 24, 39, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .glass-card { background: rgba(31, 41, 55, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col selection:bg-brand-500 selection:text-white" id="bodyTheme">

    <!-- Top Navigation Bar -->
    <header class="sticky top-0 z-50 glass-panel border-b border-slate-800 px-4 py-3">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3 rtl:space-x-reverse">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-emerald-400 flex items-center justify-center shadow-lg shadow-brand-500/30">
                    <i class="fa-solid fa-brain-circuit text-white text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg tracking-tight bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">Face-to-Face AI</h1>
                    <span class="text-xs text-brand-400 font-medium">Türkiye Marketplace</span>
                </div>
            </div>

            <!-- Global Spectrum Themes & Controls -->
            <div class="flex items-center space-x-2 rtl:space-x-reverse">
                <select id="themeSelector" onchange="changeTheme(this.value)" class="bg-slate-900 border border-slate-700 text-xs rounded-lg px-2 py-1.5 text-slate-300 focus:outline-none focus:border-brand-500">
                    <option value="emerald">🟢 Crystal Emerald</option>
                    <option value="sapphire">🔵 Royal Sapphire</option>
                    <option value="gold">🟡 Solar Gold</option>
                    <option value="magenta">🟣 Cyber Magenta</option>
                    <option value="obsidian">⚫ Velvet Obsidian</option>
                </select>

                <button onclick="toggleLanguage()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-semibold rounded-lg transition-all flex items-center space-x-1 rtl:space-x-reverse">
                    <i class="fa-solid fa-globe text-brand-400"></i>
                    <span id="langBtnText">العربية</span>
                </button>

                <button onclick="openModal('authModal')" class="p-2 bg-brand-600 hover:bg-brand-500 text-white rounded-lg text-xs font-semibold shadow-md shadow-brand-600/20 transition-all">
                    <i class="fa-solid fa-user"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 space-y-6 pb-24">
        
        <!-- Live Face-to-Face AI Banner -->
        <section class="glass-card rounded-2xl p-6 relative overflow-hidden border border-brand-500/20 shadow-2xl">
            <div class="absolute -right-10 -bottom-10 w-48 h-48 bg-brand-500/10 rounded-full blur-3xl pointer-events-none"></div>
            <div class="flex flex-col md:flex-row items-center justify-between gap-6">
                <div class="space-y-2 text-center md:text-start rtl:md:text-right">
                    <span class="px-3 py-1 bg-brand-500/20 text-brand-400 text-xs font-bold rounded-full uppercase tracking-wider border border-brand-500/30">Live AI Assistant</span>
                    <h2 class="text-2xl font-extrabold text-white" id="aiBannerTitle">مساعد الذكاء الاصطناعي وجهاً لوجه</h2>
                    <p class="text-slate-400 text-sm max-w-xl" id="aiBannerDesc">ابحث عن المنتجات، تفاوض مع التجار في تركيا، وقم بالترويج لخدماتك بلحظات عبر الصوت والصورة باللغتين العربية والتركية.</p>
                </div>
                <button onclick="startAIVoiceSession()" class="px-6 py-3 bg-gradient-to-r from-brand-600 to-emerald-500 hover:from-brand-500 hover:to-emerald-400 text-white font-bold rounded-xl shadow-lg shadow-brand-600/30 transition-all flex items-center space-x-2 rtl:space-x-reverse">
                    <i class="fa-solid fa-video text-lg animate-pulse"></i>
                    <span id="aiBtnText">بدء المحادثة المباشرة</span>
                </button>
            </div>
        </section>

        <!-- Categories Grid -->
        <section>
            <div class="flex items-center justify-between mb-4">
                <h3 class="font-bold text-lg text-white" id="categoriesTitle">الأقسام والخدمات</h3>
                <span class="text-xs text-slate-400">₺ TRY</span>
            </div>
            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3">
                <button onclick="filterCategory('all')" class="p-4 rounded-xl glass-card hover:border-brand-500 transition-all text-center group">
                    <i class="fa-solid fa-border-all text-xl text-brand-400 mb-2 group-hover:scale-110 transition-transform"></i>
                    <span class="block text-xs font-semibold text-slate-200" id="catAll">الكل</span>
                </button>
                <button onclick="filterCategory('phones')" class="p-4 rounded-xl glass-card hover:border-brand-500 transition-all text-center group">
                    <i class="fa-solid fa-mobile-screen text-xl text-brand-400 mb-2 group-hover:scale-110 transition-transform"></i>
                    <span class="block text-xs font-semibold text-slate-200" id="catPhones">هواتف</span>
                </button>
                <button onclick="filterCategory('cars')" class="p-4 rounded-xl glass-card hover:border-brand-500 transition-all text-center group">
                    <i class="fa-solid fa-car text-xl text-brand-400 mb-2 group-hover:scale-110 transition-transform"></i>
                    <span class="block text-xs font-semibold text-slate-200" id="catCars">سيارات</span>
                </button>
                <button onclick="filterCategory('construction')" class="p-4 rounded-xl glass-card hover:border-brand-500 transition-all text-center group">
                    <i class="fa-solid fa-helmet-safety text-xl text-brand-400 mb-2 group-hover:scale-110 transition-transform"></i>
                    <span class="block text-xs font-semibold text-slate-200" id="catConst">بناء</span>
                </button>
                <button onclick="filterCategory('computers')" class="p-4 rounded-xl glass-card hover:border-brand-500 transition-all text-center group">
                    <i class="fa-solid fa-laptop text-xl text-brand-400 mb-2 group-hover:scale-110 transition-transform"></i>
                    <span class="block text-xs font-semibold text-slate-200" id="catComp">كمبيوترات</span>
                </button>
            </div>
        </section>

        <!-- Marketplace Listings -->
        <section>
            <div class="flex items-center justify-between mb-4">
                <h3 class="font-bold text-lg text-white" id="listingsTitle">الإعلانات المعروضة في تركيا</h3>
                <button onclick="openModal('addListingModal')" class="px-3 py-1.5 bg-brand-600 hover:bg-brand-500 text-white text-xs font-semibold rounded-lg shadow transition-all flex items-center space-x-1 rtl:space-x-reverse">
                    <i class="fa-solid fa-plus"></i>
                    <span id="addListingBtn">إعلان جديد</span>
                </button>
            </div>
            <div id="listingsContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                <!-- Dynamic Listings Rendered Here -->
            </div>
        </section>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 glass-panel border-t border-slate-800 px-6 py-2.5 z-40 flex items-center justify-around">
        <button onclick="switchTab('home')" class="flex flex-col items-center text-brand-400 space-y-1">
            <i class="fa-solid fa-house text-lg"></i>
            <span class="text-[10px] font-medium" id="navHome">الرئيسية</span>
        </button>
        <button onclick="openChatModal()" class="flex flex-col items-center text-slate-400 hover:text-brand-400 space-y-1">
            <i class="fa-solid fa-comments text-lg"></i>
            <span class="text-[10px] font-medium" id="navChat">محادثة</span>
        </button>
        <button onclick="openModal('addListingModal')" class="flex flex-col items-center
